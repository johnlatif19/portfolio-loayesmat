<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Louay Esmat | KEXART</title>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        /* ===== RESET & BASE ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: #0a0a0a;
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* ===== LOADER (يظهر أول 3 ثواني) ===== */
        #loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0a0a0a;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.8s ease;
        }

        #loader.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .loader-spinner {
            width: 60px;
            height: 60px;
            border: 5px solid #1a1a1a;
            border-top: 5px solid #f0c040;
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loader-text {
            margin-top: 20px;
            font-size: 18px;
            letter-spacing: 3px;
            color: #f0c040;
            text-transform: uppercase;
        }

        /* ===== CARD ===== */
        .card {
            background: #141414;
            border-radius: 28px;
            padding: 40px 35px;
            max-width: 480px;
            width: 100%;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
            border: 1px solid #2a2a2a;
            text-align: center;
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 0.8s ease, transform 0.8s ease;
        }

        .card.show {
            opacity: 1;
            transform: translateY(0);
        }

        /* ===== AVATAR (صورة شخصية) ===== */
        .avatar {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            margin: 0 auto 20px;
            overflow: hidden;
            border: 4px solid #f0c040;
            box-shadow: 0 0 0 4px #2a2a2a, 0 0 0 8px #141414, 0 0 30px rgba(240, 192, 64, 0.2);
            transition: transform 0.5s ease, box-shadow 0.5s ease;
        }

        .avatar:hover {
            transform: scale(1.05);
            box-shadow: 0 0 0 4px #2a2a2a, 0 0 0 8px #141414, 0 0 50px rgba(240, 192, 64, 0.4);
        }

        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* ===== NAME & TITLE ===== */
        .name {
            font-size: 32px;
            font-weight: 700;
            letter-spacing: 1px;
        }
        .name span { color: #f0c040; }

        .title {
            color: #aaaaaa;
            font-size: 16px;
            margin-top: 6px;
            letter-spacing: 2px;
            border-bottom: 1px solid #2a2a2a;
            padding-bottom: 18px;
        }

        /* ===== BIO ===== */
        .bio {
            margin: 20px 0 25px;
            font-size: 15px;
            line-height: 1.8;
            color: #cccccc;
        }

        /* ===== SOCIAL LINKS ===== */
        .socials {
            display: flex;
            justify-content: center;
            gap: 18px;
            margin-bottom: 28px;
            flex-wrap: wrap;
        }
        .socials a {
            color: #aaaaaa;
            font-size: 24px;
            transition: 0.3s;
            text-decoration: none;
        }
        .socials a:hover {
            color: #f0c040;
            transform: scale(1.2);
        }

        /* ===== BUTTON (واتساب) ===== */
        .btn-whatsapp {
            display: inline-block;
            background: #25d366;
            color: #fff;
            font-size: 18px;
            font-weight: 600;
            padding: 14px 32px;
            border-radius: 50px;
            text-decoration: none;
            transition: 0.3s;
            box-shadow: 0 6px 20px rgba(37, 211, 102, 0.3);
        }
        .btn-whatsapp i { margin-right: 10px; }
        .btn-whatsapp:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 30px rgba(37, 211, 102, 0.5);
        }

        /* ===== FOOTER ===== */
        .footer {
            margin-top: 25px;
            font-size: 13px;
            color: #555;
            letter-spacing: 1px;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 500px) {
            .card { padding: 28px 18px; }
            .name { font-size: 26px; }
            .avatar { width: 100px; height: 100px; }
        }
    </style>
</head>
<body>

    <!-- ===== LOADER (3 ثواني) ===== -->
    <div id="loader">
        <div class="loader-spinner"></div>
        <div class="loader-text">جاري التحميل...</div>
    </div>

    <!-- ===== CARD ===== -->
    <div class="card" id="card">
        <!-- الصورة الشخصية -->
        <div class="avatar">
            <!-- 🔽 🔽 🔽 حط رابط الصورة هنا 🔽 🔽 🔽 -->
            <img src="https://i.postimg.cc/W3G3gjVT/loay.jpg" alt="Louay Esmat" />
        </div>

        <h1 class="name">Louay <span>Esmat</span></h1>
        <p class="title">🎨 فنان تشكيلي | KEXART</p>

        <p class="bio">
            مرحباً! أنا <strong>Louay</strong>، شغوف بالفن والتعبير عن المشاعر من خلال الألوان والأشكال. 
            كل لوحة تحكي قصة، وكل ضربة فرشاة تحمل جزءاً من الروح.
        </p>

        <!-- السوشيال ميديا -->
        <div class="socials">
            <a href="#" target="_blank"><i class="fab fa-instagram"></i></a>
            <a href="#" target="_blank"><i class="fab fa-facebook"></i></a>
            <a href="#" target="_blank"><i class="fab fa-youtube"></i></a>
            <a href="#" target="_blank"><i class="fab fa-pinterest"></i></a>
        </div>

        <!-- زر واتساب بالرقم الجديد -->
        <a class="btn-whatsapp" href="https://wa.me/201013426029" target="_blank">
            <i class="fab fa-whatsapp"></i> تواصل عبر واتساب
        </a>

        <div class="footer">© 2026 Louay Esmat — كل الحقوق محفوظة</div>
    </div>

    <!-- ===== MUSIC (يشتغل تلقائياً بعد 3 ثواني) ===== -->
    <audio id="bgMusic" loop preload="auto">
        <!-- 🔽 غير الرابط ده لو عاوز تغير الموسيقى 🔽 -->
        <source src="https://outside-lime-ewtx1852.edgeone.dev" type="audio/mpeg" />
    </audio>

    <script>
        // ============================================================
        // 1. لما الصفحة تتحمل، نبدأ计时 3 ثواني
        // 2. بعد 3 ثواني: نخفي الـ loader + نظهر الكارد + نشغل الموسيقى
        // ============================================================

        window.addEventListener('load', function () {

            const loader = document.getElementById('loader');
            const card = document.getElementById('card');
            const music = document.getElementById('bgMusic');

            // نبدأ timer 3 ثواني
            setTimeout(function () {

                // 1️⃣ إخفاء الـ loader
                loader.classList.add('hidden');

                // 2️⃣ إظهار الكارد مع أنيميشن
                card.classList.add('show');

                // 3️⃣ تشغيل الموسيقى
                music.play().catch(function (err) {
                    // بعض المتصفحات تمنع التشغيل التلقائي،
                    // هنحاول تاني لو المستخدم ضغط في أي مكان
                    console.log('محتاج تفاعل من المستخدم لتشغيل الموسيقى');
                });

            }, 3000); // 3 ثواني بالضبط

            // لو الموسيقى ما اشتغلتش بسبب سياسة المتصفح،
            // تشتغل أول ما المستخدم يضغط في أي حتة
            document.addEventListener('click', function () {
                const music = document.getElementById('bgMusic');
                if (music.paused) {
                    music.play().catch(() => {});
                }
            }, { once: true }); // يشتغل مرة واحدة بس

        });
    </script>

</body>
</html>
